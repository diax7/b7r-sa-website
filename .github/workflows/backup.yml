name: Backup

# Weekly database backup (BRD 9.8, ADR-034): `pg_dump` of the production database into the
# PRIVATE backup bucket through scripts/backup.sh. Secrets live in the `production` GitHub
# environment; until they are set the job ends early with a notice. Retention is a lifecycle
# rule on the bucket (docs/RUNBOOK.md, "Backups and restore").

on:
  schedule:
    - cron: '0 3 * * 0' # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Check the backup secrets
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_S3_BUCKET" ] || [ -z "$BACKUP_S3_ACCESS_KEY_ID" ]; then
            echo "::notice::DATABASE_URL / BACKUP_S3_* are not set in the production environment; no backup taken."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      # pg_dump must be at least the server's major (Postgres 16 on CranL).
      - name: Install the Postgres 16 client
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null
          pg_dump --version

      - name: Dump and upload
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/backup.sh
