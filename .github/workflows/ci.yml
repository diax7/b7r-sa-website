name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # NEXT_PUBLIC_* values are inlined at build time, so the production origin must be set for
  # the whole job: Lighthouse's SEO = 100 requires the noindex guard to be off.
  NEXT_PUBLIC_SITE_URL: https://b7r.sa
  NEXT_PUBLIC_APP_URL: https://b7r.app
  NEXT_PUBLIC_WHATSAPP: '966501699572'
  # Dummy analytics ids so Lighthouse and the e2e budgets measure the production shape and
  # the consent path runs; the Umami stand-in records calls instead of sending them.
  NEXT_PUBLIC_GA_ID: G-TEST00000
  NEXT_PUBLIC_UMAMI_SRC: http://localhost:3004/umami-test.js
  NEXT_PUBLIC_UMAMI_ID: test
  # In-memory newsletter transport for the e2e success path (no Resend key in CI).
  NEWSLETTER_TRANSPORT: mock

jobs:
  quality:
    name: Typecheck, lint, tests, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: RTL class check
        run: pnpm check:rtl

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse CI
        run: pnpm lhci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14
