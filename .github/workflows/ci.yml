name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # NEXT_PUBLIC_* values are inlined at build time, so the production origin must be set for
  # the whole job: Lighthouse's SEO = 100 requires the noindex guard to be off.
  NEXT_PUBLIC_SITE_URL: https://b7r.sa
  NEXT_PUBLIC_APP_URL: https://b7r.app
  NEXT_PUBLIC_WHATSAPP: '966501699572'
  # Dummy analytics ids so Lighthouse and the e2e budgets measure the production shape and
  # the consent path runs; the Umami stand-in records calls instead of sending them.
  NEXT_PUBLIC_GA_ID: G-TEST00000
  NEXT_PUBLIC_UMAMI_SRC: http://localhost:3004/umami-test.js
  NEXT_PUBLIC_UMAMI_ID: test
  # In-memory newsletter and contact transports for the e2e success paths (no Resend key).
  NEWSLETTER_TRANSPORT: mock
  CONTACT_TRANSPORT: mock
  # The content engine's mock provider for the e2e run (ADR-042); refused in production.
  AI_CONTENT_MOCK: '1'
  # Cloudflare's public always-pass test site key so the Turnstile island renders; the e2e
  # serves a stub for the widget script and no secret is set, so nothing reaches Cloudflare.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # The CMS (BRD 9): a throwaway Postgres service, a CI-only secret and admin. The admin
  # panel is exercised on localhost, so Payload's own origin is the local one while the
  # site origin above keeps the noindex guard off.
  DATABASE_URL: postgres://b7r:b7r@localhost:5432/b7r
  PAYLOAD_SECRET: ci-only-secret-never-used-outside-github-actions
  PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3004
  ADMIN_EMAIL: ci-admin@b7r.sa
  ADMIN_PASSWORD: Ci-Admin-Password-For-Tests-2026

jobs:
  quality:
    name: Typecheck, lint, tests, seed, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b7r
          POSTGRES_PASSWORD: b7r
          POSTGRES_DB: b7r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b7r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: RTL class check
        run: pnpm check:rtl

      - name: No em dashes (writing rule)
        run: pnpm check:dash

      - name: Unit tests
        run: pnpm test

      - name: Migrate the schema
        run: bash scripts/ci/migrate.sh

      - name: Seed content and the first admin (integration check)
        run: bash scripts/ci/seed-check.sh

      # A backup that cannot be restored is not a backup (ADR-034): dump the seeded database
      # the way scripts/backup.sh does, restore into a scratch database, count the documents.
      - name: Restore rehearsal
        run: bash scripts/ci/restore-check.sh

      # A production database seeded before Level 5 has no English: the build must still
      # pass, with /en as a static 404 (ADR-043). Proven once here, before the real build.
      - name: Build with the site not in English
        run: pnpm build
        env:
          SITE_ENGLISH: off

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E
        timeout-minutes: 20
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse CI
        run: bash scripts/ci/lighthouse.sh

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14

  s3:
    name: Media on S3 (MinIO), admin, CSP, products, machine files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b7r
          POSTGRES_PASSWORD: b7r
          POSTGRES_DB: b7r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b7r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      S3_BUCKET: b7r-media
      S3_REGION: auto
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000/b7r-media
      S3_ACCESS_KEY_ID: minio-ci
      S3_SECRET_ACCESS_KEY: minio-ci-secret
      # MinIO answers on localhost, which the image optimiser refuses by default (SSRF guard).
      IMAGES_ALLOW_LOCAL_IP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub service containers cannot take a command, and MinIO needs `server /data`.
      - name: Start MinIO and create the public bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            "mc alias set ci http://localhost:9000 $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY && mc mb --ignore-existing ci/$S3_BUCKET && mc anonymous set download ci/$S3_BUCKET && mc mb --ignore-existing ci/b7r-backups"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate, seed, first admin
        run: |
          bash scripts/ci/migrate.sh
          pnpm content:migrate
          pnpm admin:create

      # The backup lands in a PRIVATE bucket (ADR-034): the script refuses the media bucket,
      # and an outsider can neither list the bucket nor read the dump.
      - name: Backup to the private bucket and check it from the outside
        env:
          BACKUP_S3_BUCKET: b7r-backups
          BACKUP_S3_ACCESS_KEY_ID: ${{ env.S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ env.S3_SECRET_ACCESS_KEY }}
        run: |
          pipx install awscli --quiet 2>/dev/null || pip install --quiet --user awscli
          bash scripts/backup.sh
          stamp=$(date -u +%Y-%m-%d)
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:9000/b7r-backups/$stamp.dump")
          list=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:9000/b7r-backups/")
          echo "dump=$code list=$list"
          [ "$code" = "403" ] && [ "$list" = "403" ] || { echo "the backup bucket is readable without credentials" >&2; exit 1; }
          if BACKUP_S3_BUCKET="$S3_BUCKET" bash scripts/backup.sh; then
            echo "the script accepted the media bucket" >&2
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (S3 subset)
        timeout-minutes: 15
        run: |
          pnpm exec playwright test e2e/csp.spec.ts e2e/products.spec.ts e2e/machine-files.spec.ts --project=desktop-chrome
          pnpm exec playwright test --project=cms --no-deps

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-s3
          path: playwright-report
          retention-days: 7
