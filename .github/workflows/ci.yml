name: CI

# Runs on the pull request only (ADR-045): a squash merge of a branch that contains `main`
# lands the tree the PR run tested, so a run on `main` would repeat it. `scripts/merge-pr.sh`
# checks that before merging; `workflow_dispatch` runs `main` by hand when wanted.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # NEXT_PUBLIC_* values are inlined at build time, so the production origin must be set for
  # the whole job: Lighthouse's SEO = 100 requires the noindex guard to be off.
  NEXT_PUBLIC_SITE_URL: https://b7r.sa
  # In-memory newsletter and contact transports for the e2e success paths (no Resend key).
  NEWSLETTER_TRANSPORT: mock
  CONTACT_TRANSPORT: mock
  # The content engine's mock provider for the e2e run (ADR-042); refused in production.
  AI_CONTENT_MOCK: '1'
  # Cloudflare's public always-pass test site key so the Turnstile island renders; the e2e
  # serves a stub for the widget script and no secret is set, so nothing reaches Cloudflare.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # The CMS (BRD 9): a throwaway Postgres service, a CI-only secret and admin. The admin
  # panel is exercised on localhost, so Payload's own origin is the local one while the
  # site origin above keeps the noindex guard off.
  DATABASE_URL: postgres://b7r:b7r@localhost:5432/b7r
  PAYLOAD_SECRET: ci-only-secret-never-used-outside-github-actions
  PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3004
  ADMIN_EMAIL: ci-admin@b7r.sa
  ADMIN_PASSWORD: Ci-Admin-Password-For-Tests-2026

jobs:
  quality:
    name: Typecheck, lint, tests, seed, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b7r
          POSTGRES_PASSWORD: b7r
          POSTGRES_DB: b7r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b7r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: RTL class check
        run: pnpm check:rtl

      - name: No em dashes (writing rule)
        run: pnpm check:dash

      - name: Unit tests
        run: pnpm test

      - name: Migrate the schema
        run: bash scripts/ci/migrate.sh

      - name: Seed content and the first admin (integration check)
        run: bash scripts/ci/seed-check.sh

      # The analytics ids live in the admin (ADR-052): the dummy GA4 id and the Umami
      # stand-in go into the seeded settings so the consent path and the budgets run.
      - name: Analytics test ids
        run: pnpm exec tsx scripts/ci/analytics-ids.ts

      # The visibility pull twice the same day writes one row per source, replaced, not
      # doubled (ADR-049): the upsert proven against the real schema, no service connected.
      - name: Visibility pull (integration check)
        run: pnpm visibility:pull --check

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E
        timeout-minutes: 20
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse CI
        run: bash scripts/ci/lighthouse.sh

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 14

  s3:
    name: Media on S3 (SeaweedFS), admin, CSP, products, machine files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b7r
          POSTGRES_PASSWORD: b7r
          POSTGRES_DB: b7r
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b7r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      S3_BUCKET: b7r-media
      S3_REGION: auto
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000/b7r-media
      S3_ACCESS_KEY_ID: s3-ci
      S3_SECRET_ACCESS_KEY: s3-ci-secret
      # The S3 server answers on localhost, which the image optimiser refuses by default (SSRF guard).
      IMAGES_ALLOW_LOCAL_IP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SeaweedFS (MinIO stopped publishing images and binaries in 2026-09). Its config gives
      # the job's key full access and anyone read on the bucket, as production's public
      # bucket; a service container cannot take the `server` command.
      - name: Start SeaweedFS and create the public bucket
        run: |
          cat > "$RUNNER_TEMP/s3.json" <<EOF
          {"identities": [
            {"name": "ci", "credentials": [{"accessKey": "$S3_ACCESS_KEY_ID", "secretKey": "$S3_SECRET_ACCESS_KEY"}],
             "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
            {"name": "anonymous", "actions": ["Read:$S3_BUCKET"]}
          ]}
          EOF
          docker run -d --name s3 -p 9000:9000 -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:9000/healthz && break; sleep 1; done
          docker exec s3 sh -c "echo 's3.bucket.create -name $S3_BUCKET' | weed shell -master=localhost:9333"
          # Anyone may read the bucket: a missing key is 404, not 403.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:9000/$S3_BUCKET/none")
          [ "$code" = 404 ] || { echo "the bucket is not publicly readable ($code)"; docker logs s3 | tail -40; exit 1; }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate, seed, first admin, analytics test ids
        run: |
          bash scripts/ci/migrate.sh
          pnpm content:migrate
          pnpm admin:create
          pnpm exec tsx scripts/ci/analytics-ids.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (S3 subset)
        timeout-minutes: 15
        run: |
          pnpm exec playwright test e2e/csp.spec.ts e2e/products.spec.ts e2e/machine-files.spec.ts e2e/designer.spec.ts --project=desktop-chrome
          pnpm exec playwright test --project=cms --no-deps

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-s3
          path: playwright-report
          retention-days: 7
