name: Deploy

# Builds the production image (BRD 8.6, ADR-025) for a platform that deploys a registry
# image: the Dockerfile migrates the production database and prerenders every page from it;
# the image is pushed to GHCR. A platform that builds from the repository (CranL, Koyeb,
# Render, Qovery) does not need this workflow (docs/RUNBOOK.md, "Deploy"). Secrets live in
# the `production` GitHub environment; until they are set the job ends early with a notice,
# so a push to main never fails on them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  IMAGE: ghcr.io/diax7/b7r-sa-website

jobs:
  image:
    name: Migrate, build, push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check the production secrets
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PAYLOAD_SECRET" ]; then
            echo "::notice::DATABASE_URL / PAYLOAD_SECRET are not set in the production environment; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      # The Dockerfile's build stage migrates first (additive migrations only, docs/RUNBOOK.md:
      # the running image keeps serving while the new columns land), then prerenders.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.secrets.outputs.ready == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.secrets.outputs.ready == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://b7r.sa
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            PAYLOAD_PUBLIC_SERVER_URL=https://b7r.sa
            S3_BUCKET=${{ vars.S3_BUCKET }}
            S3_REGION=${{ vars.S3_REGION || 'auto' }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            S3_PUBLIC_URL=${{ vars.S3_PUBLIC_URL }}
