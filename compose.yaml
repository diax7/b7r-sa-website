# Local services for the CMS (Phase 2a): Postgres 16 and SeaweedFS standing in for CranL's managed
# Postgres and S3 bucket. `docker compose up -d`, then see docs/RUNBOOK.md "Local CMS".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b7r
      POSTGRES_USER: b7r
      POSTGRES_PASSWORD: b7r
    ports:
      - '5435:5432'
    volumes:
      - b7r-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b7r -d b7r']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible media storage (SeaweedFS; MinIO stopped publishing images in 2026-09). The
  # config holds the local key and gives anyone read on `b7r-media`, as production's bucket.
  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - '9000:9000'
    volumes:
      - ./scripts/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - b7r-s3:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once (safe to repeat).
  s3-init:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c', 'echo "s3.bucket.create -name b7r-media" | weed shell -master=s3:9333']

volumes:
  b7r-db:
  b7r-s3:
