# Local services for the CMS (Phase 2a): Postgres 16 and MinIO standing in for CranL's managed
# Postgres and S3 bucket. `docker compose up -d`, then see docs/RUNBOOK.md "Local CMS".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b7r
      POSTGRES_USER: b7r
      POSTGRES_PASSWORD: b7r
    ports:
      - '5435:5432'
    volumes:
      - b7r-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U b7r -d b7r']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: b7rminio
      MINIO_ROOT_PASSWORD: b7rminio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - b7r-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once with public read for objects (the site serves images from it).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 b7rminio b7rminio123 &&
      mc mb --ignore-existing local/b7r-media &&
      mc anonymous set download local/b7r-media
      "

volumes:
  b7r-db:
  b7r-minio:
