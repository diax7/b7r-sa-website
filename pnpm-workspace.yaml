# pnpm project settings (pnpm 10+ reads these from here, not package.json)
minimumReleaseAge: 1440
# Install scripts are disabled globally (.npmrc ignore-scripts=true). sharp, esbuild and
# @swc/core ship prebuilt binaries through optional dependencies, so nothing needs to build.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  sharp: false
overrides:
  # Transitive advisories under @lhci/cli (dev-only CI tool), pinned to patched versions.
  tmp: 0.2.7
  'uuid@<11.1.1': 11.1.1
  qs: 6.16.0
  'ip-address@<10.7.1': 10.7.2
  'brace-expansion@<1.1.21': 1.1.21
  'basic-ftp@<6.2.1': 6.2.1
  # Payload's admin (monaco editor) pins dompurify 3.4.8; the patched line is API-compatible.
  'dompurify@<3.4.16': 3.4.16
  # The AI SDK's provider-utils and Payload's JSON schema pin these below their patched lines.
  'undici@>=7 <7.29.1': 7.30.0
  'fast-uri@>=3 <3.1.8': 3.1.8
  # drizzle-kit (dev-time CLI under db-postgres) drags esbuild 0.18; the dev server hole
  # (GHSA-67mh-4wv8-2f99) is patched from 0.24.3 and the CLI works on the current line.
  'esbuild@<0.24.3': 0.28.2
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 via @lhci/cli > lighthouse > puppeteer-core (dev-only, never in the
    # image). The advisory names >=2.0.2 as patched but 2.0.2 is not published yet.
    # Remove these two lines when it ships. Checked 2026-09-12.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # braces <=3.0.3 (stack exhaustion on deeply nested patterns) via next > sass > chokidar,
    # the build's file watcher: its patterns come from code, never from a request. The advisory
    # names >=3.0.4 as patched but no 3.0.4 is published (npm latest 3.0.3). Remove this line
    # when it ships. Checked 2026-10-03.
    - GHSA-vfj7-8cjw-p6xm
